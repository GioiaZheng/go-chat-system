<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Chat login screen</title>
  <desc id="desc">Login form for the chat web interface.</desc>
  <rect width="390" height="844" fill="#f6f7fb"/>
  <rect x="22" y="54" width="346" height="736" rx="22" fill="#ffffff" stroke="#d8dde8"/>
