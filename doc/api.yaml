      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send a message
              required:
              - conversationId
              - content
              properties:
                conversationId:
                  type: string
                  description: ID of the target conversation
                  pattern: ^[a-zA-Z0-9-]+$
                  minLength: 1 
                  maxLength: 64
                content:
                  type: string
                  description: Message content
                  minLength: 1
                  maxLength: 1000
                  pattern: '^[\s\S]{1,1000}$'
                type:
                  type: string
                  description: Message type
                  enum: 
                  - text
                  - image
                  - video
                  - file
                  default: text
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
               $ref: '#/components/schemas/MessageResourceEnvelope'
              example:
                code: 201
                message: Message sent successfully
                data:
                  resource:
                    id: '123'
