  /messages:
    get:
      tags:
        - messages
      operationId: getConversation
      summary: Get conversation messages
      description: Retrieve messages from a specific conversation
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: query
          required: true
          description: ID of the conversation
          schema:
            type: string
            pattern: ^[a-zA-Z0-9-]+$
            minLength: 1
            maxLength: 64
        - name: limit
          in: query
          required: false
          description: Maximum number of messages to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: before
          in: query
          description: Get messages before this timestamp (ISO 8601 format)
          schema:
            type: string
            format: date-time
            minLength: 20
            maxLength: 35
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResourceEnvelopeCollection'
              example:
                code: 200
                message: Messages retrieved successfully
                data:
                  messages:
                    - id: '1'
                      content: Hello!
                      senderId: '1'
                      conversationId: 'c-1'
                      createdAt: '2023-10-01T12:00:00Z'
                      type: text
                      status: delivered
                  pagination:
                    total: 120
                    limit: 20
                    offset: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    
    post:
      tags:
      - messages
      operationId: sendMessage
