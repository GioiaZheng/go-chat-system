  /messages:
    get:
      tags: [messages]
      operationId: getConversation
      summary: Get conversation messages
      description: Retrieve messages from a specific conversation
      security: [ { BearerAuth: [] } ]
      parameters:
        - name: conversationId
          in: query
          required: true
          description: ID of the conversation
          schema:
            type: string
            description: Unique identifier of the conversation
            pattern: '^[a-zA-Z0-9_-]+$'
            minLength: 1
            maxLength: 64
        - name: limit
          in: query
          required: false
          description: Maximum number of messages to return
          schema:
            type: integer
            format: int64
            description: Maximum number of messages to retrieve
            minimum: 1
            maximum: 100
            default: 20
        - name: beforeCursor
          in: query
          required: false
          description: Return messages older than this cursor
          schema:
            type: string
            description: Opaque cursor for paginating to older messages
            minLength: 1
            maxLength: 512
            pattern: '^[A-Za-z0-9._~+=/-]+$'
        - name: afterCursor
          in: query
          required: false
          description: Return messages newer than this cursor
          schema:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^[A-Za-z0-9._~+=/-]+$'
            description: Opaque cursor for paginating to newer messages
      responses:
        '200':
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResourceEnvelopeCollection'
              example:
                code: 200
                message: Messages retrieved successfully
                data:
                  messages:
                    - id: '1'
                      content: Hello!
                      senderId: '1'
                      conversationId: 'c-1'
                      createdAt: '2023-10-01T12:00:00Z'
                      type: text
                      status: sent
                  nextCursor: "opaque-next-abc123"
                  prevCursor: "opaque-prev-def456"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [messages]
      operationId: sendMessage
      summary: Send a message
      description: Send a new message to a user or group (content or fileUrl is required)
      security: [ { BearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request payload for sending a message
              type: object
              required: [conversationId]
              properties:
                conversationId:
                  type: string
                  description: ID of the target conversation
                  pattern: '^[a-zA-Z0-9_-]+$'
                  minLength: 1
                  maxLength: 64
                content:
                  type: string
                  description: Message content
                  minLength: 0
                  maxLength: 1000
                  pattern: '^[\s\S]{0,1000}$'
                fileUrl:
                  type: string
                  description: URL of an uploaded attachment
                  minLength: 1
                  maxLength: 255
                  pattern: '^.*$'
                type:
                  type: string
                  description: Message type
                  enum: [text, image]
                  minLength: 1
                  maxLength: 50
                  default: text
                  pattern: '^.*$'
                replyToId:
                  type: string
                  description: Message ID being replied to
                  minLength: 1
                  maxLength: 64
                  pattern: '^[a-zA-Z0-9_-]+$'
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResourceEnvelope'
              example:
                code: 201
                message: Message sent successfully
                data:
                  resource:
                    id: '123'
                    content: Hello!
                    senderId: '1'
                    conversationId: 'c-1'
                    createdAt: '2023-10-01T12:00:00Z'
                    type: text
                    status: sent
        '400': { $ref: '#/components/responses/BadRequest' }
