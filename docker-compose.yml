services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      CFG_DB_FILENAME: /data/app.sqlite
    ports:
      - "3000:3000"
    volumes:
      - chat_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  chat_data:
