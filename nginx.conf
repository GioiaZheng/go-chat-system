server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 直接服务静态资源
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 可选：更长缓存的静态资源（按需打开）
  # location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
  #   try_files $uri =404;
  #   access_log off;
  #   add_header Cache-Control "public, max-age=31536000, immutable";
  # }
}
