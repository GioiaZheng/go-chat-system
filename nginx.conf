server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 支持前端路由（如 /chat/123）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 转发到后端容器
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
