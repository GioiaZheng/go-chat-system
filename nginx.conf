server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- API 反向代理到后端容器（名：wasatxt-api，端口 3000）---
  # 你的后端并没有统一 /api 前缀，因此按资源精确转发：
  location /liveness { proxy_pass http://wasatxt-api:3000; }
  location /session  { proxy_pass http://wasatxt-api:3000; }
  location /users    { proxy_pass http://wasatxt-api:3000; }
  location /groups   { proxy_pass http://wasatxt-api:3000; }
  location /messages { proxy_pass http://wasatxt-api:3000; }
  location /uploads/ { proxy_pass http://wasatxt-api:3000; }

  # 前端静态资源 & SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 透传真实 IP/Host
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
